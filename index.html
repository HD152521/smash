<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SMASH — 배드민턴 대회 운영</title>
    <meta name="description" content="대진표, 실시간 점수, 조별 순위를 코트에서 바로 관리하는 배드민턴 대회 운영 앱" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)" />
    <!-- vite.svg 는 존재하지 않는 파일이었다 (파비콘이 안 떴다) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 아이폰은 홈 화면에 추가해야 알림을 받는다. 그때 쓰는 아이콘·이름. -->
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- 구형 iOS 는 아직 apple- 접두사만 본다. 둘 다 둔다. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SMASH" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
